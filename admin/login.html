<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login - Vipline Technologies</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@700;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #050A14;
      color: #EEF2FF;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
    }
    canvas { position: fixed; inset: 0; z-index: 0; opacity: 0.4; }
    .bg-grid {
      position: fixed; inset: 0; z-index: 0;
      background-image: linear-gradient(rgba(0,102,255,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(0,102,255,0.06) 1px, transparent 1px);
      background-size: 60px 60px;
    }
    .orb {
      position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none;
      background: radial-gradient(circle, rgba(0,102,255,0.2) 0%, transparent 70%);
      width: 500px; height: 500px; top: -100px; right: -100px; z-index: 0;
    }
    .login-wrap { position: relative; z-index: 1; width: 100%; max-width: 440px; padding: 24px; }
    .login-logo {
      display: flex; align-items: center; justify-content: center; gap: 14px;
      margin-bottom: 40px;
    }
    .logo-icon {
      width: 48px; height: 48px;
      background: linear-gradient(135deg, #0066FF, #00D4FF);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.3rem; color: #fff;
      box-shadow: 0 4px 20px rgba(0,102,255,0.5);
    }
    .logo-text span { display: block; font-family: 'Syne', sans-serif; font-size: 1.2rem; font-weight: 700; }
    .logo-text small { display: block; font-size: 0.7rem; color: #7A8BA8; letter-spacing: 0.1em; text-transform: uppercase; }

    .login-card {
      background: rgba(13,17,32,0.9);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 40px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }
    .login-card h2 { font-family: 'Syne', sans-serif; font-size: 1.6rem; font-weight: 800; margin-bottom: 6px; }
    .login-card p { font-size: 0.875rem; color: #7A8BA8; margin-bottom: 32px; }

    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 0.78rem; font-weight: 600; color: #7A8BA8; margin-bottom: 8px; letter-spacing: 0.03em; }
    .input-wrap { position: relative; }
    .input-wrap i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #4D5A72; font-size: 0.9rem; pointer-events: none; }
    .input-wrap input {
      width: 100%; padding: 13px 14px 13px 42px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px; color: #EEF2FF; font-size: 0.875rem;
      outline: none; transition: border-color 0.25s, box-shadow 0.25s; font-family: inherit;
    }
    .input-wrap input:focus {
      border-color: #0066FF;
      box-shadow: 0 0 0 3px rgba(0,102,255,0.15);
    }
    .toggle-pass {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: #4D5A72; cursor: pointer; font-size: 0.9rem; transition: color 0.2s;
    }
    .toggle-pass:hover { color: #EEF2FF; }

    .btn-login {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, #0066FF, #00D4FF);
      color: #fff; border: none; border-radius: 10px;
      font-family: inherit; font-size: 0.9rem; font-weight: 700;
      cursor: pointer; transition: opacity 0.2s, transform 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      box-shadow: 0 4px 20px rgba(0,102,255,0.4);
    }
    .btn-login:hover { opacity: 0.92; transform: translateY(-1px); }
    .btn-login:active { transform: translateY(0); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .alert { padding: 12px 16px; border-radius: 8px; font-size: 0.82rem; margin-bottom: 20px; display: none; }
    .alert.show { display: flex; align-items: center; gap: 10px; }
    .alert.error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.25); color: #EF4444; }

    .login-footer { text-align: center; margin-top: 24px; font-size: 0.75rem; color: #4D5A72; }
    .login-footer a { color: #00D4FF; }
    .default-creds {
      margin-top: 20px;
      padding: 12px;
      background: rgba(255,184,0,0.06);
      border: 1px solid rgba(255,184,0,0.2);
      border-radius: 8px;
      font-size: 0.75rem;
      color: #FFB800;
      font-family: 'JetBrains Mono', monospace;
      text-align: center;
    }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="bg-grid"></div>
  <div class="orb"></div>

  <div class="login-wrap">
    <div class="login-logo">
      <svg width="48" height="48" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="ll" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0066FF"/>
            <stop offset="100%" stop-color="#00D4FF"/>
          </linearGradient>
        </defs>
        <rect width="52" height="52" rx="13" fill="url(#ll)"/>
        <polyline points="12,14 26,41 40,14" stroke="white" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <circle cx="26" cy="41.5" r="3.2" fill="white" opacity="0.92"/>
      </svg>
      <div class="logo-text">
        <span>ViplineTech</span>
        <small>Admin Portal</small>
      </div>
    </div>

    <div class="login-card">
      <h2>Welcome back</h2>
      <p>Sign in to manage your website content</p>

      <div class="alert error" id="loginAlert"></div>

      <form id="loginForm">
        <div class="form-group">
          <label>Username</label>
          <div class="input-wrap">
            <i class="fas fa-user"></i>
            <input type="text" id="username" placeholder="Enter your username" required autocomplete="username" />
          </div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="input-wrap">
            <i class="fas fa-lock"></i>
            <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password" />
            <button type="button" class="toggle-pass" onclick="togglePass()">
              <i class="fas fa-eye" id="passIcon"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-login" id="loginBtn">
          <i class="fas fa-sign-in-alt"></i>
          <span>Sign In to Dashboard</span>
        </button>
      </form>
    </div>

    <div class="login-footer">
      <a href="/">← Back to Website</a> &nbsp;·&nbsp; Vipline Technologies © 2026
    </div>
  </div>

<script>
function togglePass() {
  const input = document.getElementById('password');
  const icon = document.getElementById('passIcon');
  if (input.type === 'password') { input.type = 'text'; icon.className = 'fas fa-eye-slash'; }
  else { input.type = 'password'; icon.className = 'fas fa-eye'; }
}

document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.querySelector('span').textContent = 'Signing in...';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      })
    });
    const r = await res.json();
    if (r.success) {
      window.location.href = '/admin/';
    } else {
      const alert = document.getElementById('loginAlert');
      alert.innerHTML = '<i class="fas fa-exclamation-circle"></i> ' + (r.message || 'Invalid credentials');
      alert.className = 'alert error show';
    }
  } catch {
    const alert = document.getElementById('loginAlert');
    alert.innerHTML = '<i class="fas fa-exclamation-circle"></i> Network error. Please try again.';
    alert.className = 'alert error show';
  } finally {
    btn.disabled = false;
    btn.querySelector('span').textContent = 'Sign In to Dashboard';
  }
});

// Canvas bg
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth; canvas.height = window.innerHeight;
const pts = Array.from({length:50}, () => ({x:Math.random()*canvas.width, y:Math.random()*canvas.height, vx:(Math.random()-.5)*.3, vy:(Math.random()-.5)*.3}));
function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  pts.forEach(p => {
    p.x+=p.vx; p.y+=p.vy;
    if(p.x<0||p.x>canvas.width) p.vx*=-1;
    if(p.y<0||p.y>canvas.height) p.vy*=-1;
    ctx.beginPath(); ctx.arc(p.x,p.y,1.5,0,Math.PI*2);
    ctx.fillStyle='rgba(0,212,255,0.5)'; ctx.fill();
  });
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
